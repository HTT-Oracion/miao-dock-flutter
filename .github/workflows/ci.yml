name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5 # 与 .fvmrc 保持一致
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run tool/check_l10n.dart
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: dart analyze packages/protocol
      - run: dart analyze services/mangasvc
      - run: dart test services/mangasvc
      - run: dart analyze services/animesvc
      - run: flutter test
      # e2e：先起真实 mangasvc，再跑（默认会 skip e2e，这里显式给服务）
      - name: mangasvc e2e
        run: |
          dart run services/mangasvc/bin/mangasvc.dart --engine mock --root /tmp/ci-lib --port 5180 &
          sleep 8
          curl -sf http://127.0.0.1:5180/health > /dev/null
          flutter test
