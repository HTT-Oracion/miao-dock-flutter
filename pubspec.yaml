name: miao_dock_flutter
description: "喵坞 MiaoDock —— 漫画翻译、音乐、番剧与桌面歌词"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

# pub workspace 根：App 与 packages / services 共享一次依赖解析（Dart 3.6+）
# 根包是 workspace 的隐式成员，不声明 resolution（子包用它向上找根）
workspace:
  - packages/protocol
  - services/mangasvc
  - services/animesvc

dependencies:
  crypto: ^3.0.6
  desktop_drop: ^0.8.4
  dio: ^5.7.0
  encrypt: ^5.0.3
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_localizations:
    sdk: flutter
  flutter_qjs:
    git:
      url: https://github.com/venera-app/flutter_qjs
      ref: 8feae95df7fb00455df129ad7a0dfec1d0e8d8e4
  flutter_riverpod: ^3.0.0
  # 敏感凭证（有道智云 appSecret / 配对令牌）走系统钥匙串，不落明文偏好（D-047）。
  flutter_secure_storage: ^11.2.0
  # 平台官方登录页内嵌（桌面独立窗口 / 移动全屏页），替代不稳定的二维码逆向登录
  desktop_webview_window: ^0.4.2
  webview_flutter: ^4.14.1
  go_router: ^16.0.0
  html: ^0.15.6
  # 音频会话：后台播放 / 锁屏控制 / 与其它 App 的音频焦点协调
  audio_session: ^0.1.24
  just_audio: ^0.10.6
  # 后台/锁屏继续播放：just_audio 的后台支持插件（含音频焦点与会话）
  just_audio_background: ^0.0.1-beta.17
  lucide_icons_flutter: ^4.0.1
  # 移动端偏好落盘目录（path_provider 官方包）；桌面端仍走 HOME 推导（D-005）
  path_provider: ^2.1.5
  protocol:
    path: packages/protocol
  qr_flutter: ^4.1.0
  wakelock_plus: ^1.8.0
  window_manager: ^0.5.2
  just_audio_media_kit: ^2.1.0
  media_kit_libs_windows_audio: ^1.0.9
  media_kit_libs_linux: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/online/
