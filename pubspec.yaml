name: miao_dock_flutter
description: "喵坞 MiaoDock —— 漫画翻译、音乐、番剧与桌面歌词"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

# pub workspace 根：App 与 packages / services 共享一次依赖解析（Dart 3.6+）
# 根包是 workspace 的隐式成员，不声明 resolution（子包用它向上找根）
workspace:
  - packages/protocol
  - services/mangasvc
  - services/animesvc

dependencies:
  desktop_drop: ^0.8.4
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0
  lucide_icons_flutter: ^4.0.1
  protocol:
    path: packages/protocol
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/
